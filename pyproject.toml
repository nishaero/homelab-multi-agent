[project]
name = "hlagents"
version = "0.1.0"
description = "A small multi agent workflow for a home lab: coordinator, specialist agents, approvals, guard rails and an audit trail, on local models."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.30,<2"]

[project.scripts]
hlagents = "hlagents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
